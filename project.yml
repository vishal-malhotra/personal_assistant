name: PersonalAssistant
options:
  bundleIdPrefix: com.vishal
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGN_IDENTITY: ""
    DEVELOPMENT_TEAM: ""

targets:
  PersonalAssistant:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - Sources
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: "Personal Assistant"
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIBackgroundModes:
          - audio
        NSMicrophoneUsageDescription: "We require microphone access to record and transcribe your meeting audio locally on-device."
        NSSpeechRecognitionUsageDescription: "We use on-device speech recognition to convert your speech to text completely offline."
        NSCalendarsFullAccessUsageDescription: "We use your calendar to automatically schedule meetings extracted from your notes with your approval."
        NSRemindersFullAccessUsageDescription: "We use Reminders to save action items extracted from your notes with your approval."
