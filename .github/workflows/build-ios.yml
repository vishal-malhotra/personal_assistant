name: Build & Test iOS IPA

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test-and-build:
    name: Run Automated Tests & Build IPA
    runs-on: macos-15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Show Xcode Version
        run: |
          xcodebuild -version

      - name: Install XcodeGen
        run: |
          brew install xcodegen

      - name: Generate Xcode Project
        run: |
          xcodegen generate

      - name: Run Automated Test Suite (Unit & Logic Validation)
        run: |
          # Dynamically detect the first available iPhone simulator on the macOS runner
          SIM_ID=$(xcrun simctl list devices available -j | jq -r '.devices | to_entries[] | .value[] | select(.name | contains("iPhone")) | .udid' | head -n 1)
          echo "Running tests on Simulator UDID: $SIM_ID"
          
          xcodebuild test \
            -project PersonalAssistant.xcodeproj \
            -scheme PersonalAssistantTests \
            -destination "platform=iOS Simulator,id=$SIM_ID" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            BUILD_DIR=./test_build

      - name: Build Application (Unsigned Release for Sideloading)
        run: |
          xcodebuild -project PersonalAssistant.xcodeproj \
            -scheme PersonalAssistant \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            BUILD_DIR=./build \
            clean build

      - name: Package Payload into IPA
        run: |
          APP_PATH=$(find ./build -name "PersonalAssistant.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Error: PersonalAssistant.app not found in build directory"
            exit 1
          fi
          echo "Found app at: $APP_PATH"
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r PersonalAssistant.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PersonalAssistant-IPA
          path: PersonalAssistant.ipa
          retention-days: 14
